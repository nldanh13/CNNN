name: Deploy CNNN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build CNNN (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Supabase public configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::Missing GitHub Actions repository variables VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY. Configure them in Settings > Secrets and variables > Actions > Variables before publishing CNNN."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" != https://* ]]; then
            echo "::error::VITE_SUPABASE_URL must start with https://"
            exit 1
          fi

      - name: Verify cloud backup rollout flag
        env:
          VITE_CLOUD_BACKUP_ENABLED: ${{ vars.VITE_CLOUD_BACKUP_ENABLED }}
        run: |
          if [[ -n "$VITE_CLOUD_BACKUP_ENABLED" && "$VITE_CLOUD_BACKUP_ENABLED" != "true" && "$VITE_CLOUD_BACKUP_ENABLED" != "false" ]]; then
            echo "::error::VITE_CLOUD_BACKUP_ENABLED must be exactly true or false (lowercase)."
            exit 1
          fi
          if [[ "$VITE_CLOUD_BACKUP_ENABLED" == "true" ]]; then
            echo "Cloud backup UI: ENABLED for test data only"
            echo "### Cloud backup: enabled (testing only)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Verify Supabase RLS with two test accounts before storing any real data."
          else
            echo "Cloud backup UI: DISABLED"
            echo "### Cloud backup: disabled" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check Turnstile deployment configuration
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          # Do not print the public key itself; only confirm whether it is set.
          if [[ -n "${VITE_TURNSTILE_SITE_KEY//[[:space:]]/}" ]]; then
            echo "Turnstile site key: configured"
            echo "### Cloudflare Turnstile: site key configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Supabase CAPTCHA must remain disabled until interactive login is verified."
          else
            echo "Turnstile site key: not configured"
            echo "### Cloudflare Turnstile: site key missing (feature inactive)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Cloudflare Turnstile is not yet configured; do not enable Supabase CAPTCHA."
          fi

      - name: Build application
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # OFF by default: enable only AFTER creating and verifying RLS tables.
          VITE_CLOUD_BACKUP_ENABLED: ${{ vars.VITE_CLOUD_BACKUP_ENABLED }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish CNNN
        id: deployment
        uses: actions/deploy-pages@v4
