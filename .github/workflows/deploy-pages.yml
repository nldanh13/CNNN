name: Deploy CNNN to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build CNNN (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Supabase public configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$VITE_SUPABASE_URL" || -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "::error::Missing GitHub Actions repository variables VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY. Configure them in Settings > Secrets and variables > Actions > Variables before publishing CNNN."
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" != https://* ]]; then
            echo "::error::VITE_SUPABASE_URL must start with https://"
            exit 1
          fi

      - name: Check automatic account plan rollout
        env:
          VITE_PATIENT_CLOUD_ENABLED: ${{ vars.VITE_PATIENT_CLOUD_ENABLED || 'true' }}
        run: |
          if [[ -n "$VITE_PATIENT_CLOUD_ENABLED" && "$VITE_PATIENT_CLOUD_ENABLED" != "true" && "$VITE_PATIENT_CLOUD_ENABLED" != "false" ]]; then
            echo "::error::VITE_PATIENT_CLOUD_ENABLED must be true or false."
            exit 1
          fi
          if [[ "$VITE_PATIENT_CLOUD_ENABLED" == "true" ]]; then
            echo "Automatic account plans: ENABLED"
          else
            echo "Automatic account plans: DISABLED; legacy plans stay on their device"
          fi

      - name: Check Turnstile deployment configuration
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          # Do not print the public key itself; only confirm whether it is set.
          if [[ -n "${VITE_TURNSTILE_SITE_KEY//[[:space:]]/}" ]]; then
            echo "Turnstile site key: configured"
            echo "### Cloudflare Turnstile: site key configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Supabase CAPTCHA must remain disabled until interactive login is verified."
          else
            echo "Turnstile site key: not configured"
            echo "### Cloudflare Turnstile: site key missing (feature inactive)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Cloudflare Turnstile is not yet configured; do not enable Supabase CAPTCHA."
          fi

      - name: Build application
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Owner confirmed all-in-one SQL applied on Supabase (2026-10-17).
          # Default ON for CNNN. Set GitHub Actions variable to literal false to roll back safely.
          VITE_PATIENT_CLOUD_ENABLED: ${{ vars.VITE_PATIENT_CLOUD_ENABLED || 'true' }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish CNNN
        id: deployment
        uses: actions/deploy-pages@v5
