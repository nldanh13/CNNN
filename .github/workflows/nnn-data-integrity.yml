name: Unified NNN data integrity
on:
  pull_request:
    branches: [main]
  push:
    branches: ["design/unified-data-architecture"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:ui
      - run: npm run check:unified-catalog
      - run: npm run check:shared-data
      - run: npm run check:data-hub
      - run: npm run check:search
      - run: npm run check:nic8-reader
      - run: npm run check:care-plan
      - run: npm run check:account
      - run: npm run check:security
      - run: npm run check:cloud-backup
      - run: npm run check:rls-read
      - run: npm run check:home-navigation
      - run: npm run check:clean-interface
      - run: npm run check:assistant
